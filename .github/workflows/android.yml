name: Build Souqna APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true

      - name: Accept licenses with preinstalled sdkmanager (v12, NOT replaced)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            echo "Licenses accepted via preinstalled sdkmanager."
          else
            echo "No preinstalled sdkmanager found; relying on AGP auto-download."
          fi

      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.bak
          rm -rf android ios web linux macos windows test
          flutter create --no-pub --org com.souqna --project-name souqna .
          rm -rf test
          cp /tmp/pubspec.bak pubspec.yaml

      - name: Apply custom manifest
        run: |
          if [ -f android-custom/AndroidManifest.xml ]; then
            cp android-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          else
            echo "ERROR: manifest missing"; exit 1
          fi

      - name: Pin SDK settings
        run: |
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 33/' "$f" || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 33/' "$f" || true
            sed -i 's/targetSdk = .*/targetSdk = 33/' "$f" || true
            sed -i 's/minSdk = .*/minSdk = 21/' "$f" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' "$f" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (with failure extract)
        run: |
          set +e
          set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build_out.txt
          ec=$?
          echo ""; echo "================ FAILURE EXTRACT ================"
          if grep -q "FAILURE: Build failed" /tmp/build_out.txt; then
            grep -n -A 70 "FAILURE: Build failed" /tmp/build_out.txt
          elif grep -q "ZipFile unknown archive" /tmp/build_out.txt; then
            echo "SDK unzip error detected (should not happen now)."
            grep -n -B2 -A20 "ZipFile unknown archive" /tmp/build_out.txt
          else
            echo "(no FAILURE marker; last 120 lines)"; tail -n 120 /tmp/build_out.txt
          fi
          echo "================================================="
          exit $ec

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: souqna-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
