name: Build Souqna APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true

      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.bak
          rm -rf android ios web linux macos windows
          flutter create --no-pub --org com.souqna --project-name souqna .
          cp /tmp/pubspec.bak pubspec.yaml

      - name: Apply custom manifest
        run: |
          if [ -f android-custom/AndroidManifest.xml ]; then
            cp android-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Pin SDK and build settings
        run: |
          f=android/app/build.gradle
          if [ -f "$f" ]; then
            sed -i 's/compileSdk = .*/compileSdk = 34/' "$f" || true
            sed -i 's/compileSdkVersion .*/compileSdkVersion 34/' "$f" || true
            sed -i 's/targetSdk = .*/targetSdk = 34/' "$f" || true
            sed -i 's/minSdk = .*/minSdk = 21/' "$f" || true
            sed -i 's/minSdkVersion .*/minSdkVersion 21/' "$f" || true
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: souqna-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
