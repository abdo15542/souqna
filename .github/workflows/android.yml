name: Build Souqna APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.9'
          channel: stable
          cache: true

      - name: Accept licenses with preinstalled sdkmanager (v12)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then yes | "$SDKM" --licenses >/dev/null 2>&1 || true; fi

      - name: Restore keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            echo "keystore restored ($(wc -c < android/app/upload-keystore.jks) bytes)"
          else
            echo "NO KEYSTORE SECRET -> build will be unsigned"
          fi

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEY_ALIAS" ]; then
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "key.properties written"
          fi

      - name: Generate Android scaffold
        run: |
          cp pubspec.yaml /tmp/pubspec.bak
          rm -rf android ios web linux macos windows test
          flutter create --no-pub --org com.souqna --project-name souqna .
          rm -rf test
          cp /tmp/pubspec.bak pubspec.yaml

      - name: Apply manifest + extra.gradle + pin sdk
        run: |
          cp android-custom/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/xml
          cp android-custom/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          cp android-custom/extra.gradle android/extra.gradle
          f=android/app/build.gradle
          if ! grep -q "extra.gradle" "$f"; then
            printf '\napply from: "../extra.gradle"\n' >> "$f"
          fi
          sed -i 's/compileSdk = .*/compileSdk = 33/' "$f" || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 33/' "$f" || true
          sed -i 's/targetSdk = .*/targetSdk = 33/' "$f" || true
          sed -i 's/minSdk = .*/minSdk = 21/' "$f" || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' "$f" || true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (with failure extract)
        run: |
          set +e; set -o pipefail
          flutter build apk --release 2>&1 | tee /tmp/build_out.txt
          ec=$?
          echo ""; echo "================ FAILURE EXTRACT ================"
          if grep -q "FAILURE: Build failed" /tmp/build_out.txt; then
            grep -n -A 70 "FAILURE: Build failed" /tmp/build_out.txt
          else
            echo "(no FAILURE marker; last 120 lines)"; tail -n 120 /tmp/build_out.txt
          fi
          echo "================================================="
          exit $ec

      - name: Upload Release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: souqna-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (manual dispatch only)
        if: success() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          TAG="v${VER}"
          gh release create "$TAG" build/app/outputs/flutter-apk/app-release.apk --title "Souqna $TAG" --notes "Signed release $TAG" || gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
