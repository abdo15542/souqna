name: Generate Keystore (run ONCE)

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate keystore and print values
        run: |
          PASS="souqna$(date +%s)"
          keytool -genkeypair -v \
            -keystore /tmp/souqna.jks -alias souqna \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=Souqna, OU=Dev, O=Souqna, L=Tripoli, ST=Libya, C=LY"
          echo "=================================================="
          echo "PASSWORD (same for both fields below):"
          echo "$PASS"
          echo "----- COPY THIS LONG LINE AS KEYSTORE_BASE64 -----"
          base64 -w0 /tmp/souqna.jks
          echo ""
          echo "=================================================="
